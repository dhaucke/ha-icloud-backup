name: iCloud Backup
description: Sichert iCloud Drive und iCloud-Fotos auf eine Netzwerkfreigabe
url: https://github.com/dhaucke/ha-icloud-backup
version: "2026.10.4"
slug: icloud_backup
init: false
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cloud-download
panel_title: iCloud Backup
homeassistant_api: true
map:
  - share:rw
  - media:rw
# Enthält das verschleierte Apple-Passwort und das Vertrauenstoken
backup_exclude:
  - rclone.conf
options: {}
schema: {}
